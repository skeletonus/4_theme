<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>

<body>
    <button id="start">START AR</button>

    <script type="module">
        import * as THREE from
            "https://esm.sh/three@0.180.0";

        import { GLTFLoader } from
            "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


        const scene = new THREE.Scene();

        const ambientLight = new THREE.AmbientLight(0xffffff, 2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 3);
        directionalLight.position.set(1, 3, 2);
        scene.add(directionalLight);

        const camera = new THREE.PerspectiveCamera();

        const renderer = new THREE.WebGLRenderer({
            alpha: true,
            antialias: true
        });

        renderer.xr.enabled = true;
        renderer.xr.setReferenceSpaceType("local-floor");

        renderer.setSize(innerWidth, innerHeight);

        document.body.appendChild(renderer.domElement);


        // Загружаем модель
        let model;

        const loader = new GLTFLoader();

        loader.load(
            "model.glb",

            gltf => {
                model = gltf.scene;

                model.visible = false;

                model.scale.set(0.3, 0.3, 0.3);

                scene.add(model);
            },

            undefined,

            error => {
                console.error("Ошибка загрузки model.glb:", error);
            }
        );


        // Маркер на поверхности
        const marker = new THREE.Mesh(
            new THREE.RingGeometry(0.08, 0.1, 32),
            new THREE.MeshBasicMaterial({
                color: 0xffffff
            })
        );

        marker.rotation.x = -Math.PI / 2;
        marker.visible = false;

        scene.add(marker);


        let hit;
        let space;


        // Запуск AR
        start.onclick = async () => {

            const session = await navigator.xr.requestSession(
                "immersive-ar",
                {
                    requiredFeatures: [
                        "hit-test",
                        "local-floor"
                    ]
                }
            );

            renderer.xr.setSession(session);


            // Пространство AR
            space = await session.requestReferenceSpace(
                "local-floor"
            );


            // Источник hit-test
            const viewerSpace =
                await session.requestReferenceSpace("viewer");

            hit = await session.requestHitTestSource({
                space: viewerSpace
            });


            // Нажатие на экран
            session.addEventListener("select", () => {

                if (marker.visible && model) {

                    model.position.copy(marker.position);

                    model.visible = true;

                    marker.visible = false;
                }
            });
        };


        // Каждый кадр AR
        renderer.setAnimationLoop((_, frame) => {

            if (frame && hit) {

                const results =
                    frame.getHitTestResults(hit);


                if (results.length) {

                    const pose =
                        results[0]
                            .getPose(space);


                    const position =
                        pose.transform.position;


                    marker.position.set(
                        position.x,
                        position.y,
                        position.z
                    );


                    if (!model?.visible) {
                        marker.visible = true;
                    }
                }
            }


            renderer.render(scene, camera);
        });

    </script>
</body>

</html>
